name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  # Verifies the Odds API key and the player-prop markets against the live API.
  # Secrets only exist inside a runner, so this is the only place the key can be
  # exercised. Costs 2 requests of the free tier's 500/month.
  odds-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke-test the Odds API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY secret on this repository — skipping."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          python tools/check_odds_api.py
