# Your league, maintained by hand.
#
# This is the fallback for when the Yahoo API is not available. Once your Yahoo
# key arrives, put the league key in config.yaml under `yahoo.league_id` and
# this file is ignored automatically — nothing here needs deleting. To force one
# or the other, set `league_source: yahoo` or `league_source: manual` in
# config.yaml (the default, `auto`, prefers Yahoo and falls back to here).
#
# You only enter PLAYER NAMES. Position and NFL team are looked up from Sleeper,
# so "Josh Allen" is enough, and team defenses accept any of "Denver Broncos",
# "Broncos", "Broncos D/ST" or "DEN".
#
# After editing, check every name resolves before you rely on it:
#
#     python -m src.run --check-league
#
# It prints each roster, flags anything it cannot match, and suggests the
# spelling it thinks you meant.
#
# ---------------------------------------------------------------------------
# THE TEAMS AND ROSTERS BELOW ARE PLACEHOLDERS. Replace them with your league.
# ---------------------------------------------------------------------------

league:
  # Shown as the league name on the published site.
  name: The Sunday Scaries Invitational
  # Your starting lineup, one entry per slot; repeat a slot to start several.
  # Valid: QB RB WR TE K DEF, plus flex slots
  #   W/R  W/T  R/T  W/R/T (or FLEX)  Q/W/R/T (or SUPERFLEX)
  roster_positions:
  - QB
  - RB
  - RB
  - WR
  - WR
  - TE
  - W/R/T
  - K
  - DEF
scoring:
  # One of: ppr, half_ppr, standard
  preset: half_ppr
  # Anything your league scores differently. Stat key names are in
  # src/scoring.py — pass_yd, rush_td, rec, def_sack, def_pa_0, and so on.
  overrides:
    pass_td: 6
# Each team needs a name and a roster. `manager` and `record` are optional;
# `record` accepts [wins, losses] or "2-1".
#
# By default the engine starts whichever legal lineup projects highest. To
# model the lineup a manager ACTUALLY set — mistakes included — add a
# `starters:` list in the same order as roster_positions above:
#
#     starters: [Josh Allen, Bijan Robinson, Chase Brown, Ja'Marr Chase,
#                Puka Nacua, Brock Bowers, Jaxon Smith-Njigba,
#                Brandon Aubrey, Denver Broncos]
teams:
